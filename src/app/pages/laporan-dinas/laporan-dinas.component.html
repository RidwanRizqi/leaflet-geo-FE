<div class="container-fluid">
    <app-breadcrumbs title="Laporan Dinas" [breadcrumbItems]="[{ label: 'Laporan', active: true }]"></app-breadcrumbs>

    <div class="row">
        <div class="col-lg-12">
            <div class="card">
                <div class="card-header align-items-center d-flex">
                    <h4 class="card-title mb-0 flex-grow-1">Cetak Laporan Perjalanan Dinas</h4>
                </div>

                <div class="card-body">
                    <p class="text-muted">Silakan isi formulir di bawah ini untuk mencetak Laporan Perjalanan Dinas. Pilih format laporan yang diinginkan, kemudian cetak sebagai PDF atau Word.</p>
                    
                    <form [formGroup]="laporanForm">
                        <div class="row mb-4">
                            <div class="col-lg-12">
                                <label class="form-label fw-bold">Pilih Jenis Laporan:</label>
                                <div class="d-flex gap-4">
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" formControlName="jenisLaporan" id="jenisSppd" value="sppd">
                                        <label class="form-check-label" for="jenisSppd">
                                            Surat Perjalanan Dinas
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" formControlName="jenisLaporan" id="jenisLpd" value="lpd">
                                        <label class="form-check-label" for="jenisLpd">
                                            Laporan Perjalanan Dinas
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="row gy-3">
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Pejabat Pembuat Komitmen</label>
                                    <input type="text" class="form-control" formControlName="pejabatKomitmen" placeholder="Masukkan Nama Pejabat">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Nama Pegawai</label>
                                    <input type="text" class="form-control" formControlName="nama" placeholder="Masukkan Nama Pegawai">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">NIP</label>
                                    <input type="text" class="form-control" formControlName="nip" placeholder="Masukkan NIP">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Jabatan, Pangkat, Golongan</label>
                                    <input type="text" class="form-control" formControlName="jabatan" placeholder="Contoh: Penelaah Teknis Kebijakan / III/a">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Maksud Perjalanan Dinas</label>
                                    <input type="text" class="form-control" formControlName="maksudPerjalanan" placeholder="Tujuan perjalanan">
                                </div>
                            </div>
                            
                            <div class="col-12 mt-3"><h5 class="fs-14">Detail Perjalanan</h5><hr class="mt-0"></div>

                            <div class="col-md-4">
                                <div>
                                    <label class="form-label">Dari (Tempat Berangkat)</label>
                                    <input type="text" class="form-control" formControlName="berangkatDari">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div>
                                    <label class="form-label">Ke (Tempat Tujuan)</label>
                                    <input type="text" class="form-control" formControlName="tujuan">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div>
                                    <label class="form-label">Kendaraan</label>
                                    <input type="text" class="form-control" formControlName="kendaraan" placeholder="Contoh: Umum">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div>
                                    <label class="form-label">Lama Perjalanan (Hari)</label>
                                    <input type="number" class="form-control" formControlName="lamaPerjalanan">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div>
                                    <label class="form-label">Tanggal Berangkat</label>
                                    <input type="date" class="form-control" formControlName="tanggalBerangkat">
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div>
                                    <label class="form-label">Tanggal Kembali</label>
                                    <input type="date" class="form-control" formControlName="tanggalKembali">
                                </div>
                            </div>

                            <div class="col-12 mt-3"><h5 class="fs-14">Biaya & Administrasi</h5><hr class="mt-0"></div>

                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Beban Biaya (Atas Beban)</label>
                                    <input type="text" class="form-control" formControlName="atasBeban">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Kode Rekening</label>
                                    <input type="text" class="form-control" formControlName="kodeRekening">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Keterangan Lain-lain</label>
                                    <input type="text" class="form-control" formControlName="keterangan">
                                </div>
                            </div>
                            <div class="col-md-6">
                                <div>
                                    <label class="form-label">Tanggal Surat Dikeluarkan</label>
                                    <input type="date" class="form-control" formControlName="tanggalDikeluarkan">
                                </div>
                            </div>
                        </div>

                        <div class="d-flex gap-2 mt-4 pt-3 border-top">
                            <button type="button" class="btn btn-primary" (click)="cetakPDF()" [disabled]="laporanForm.invalid || isGenerating">
                                <i class="ri-printer-line align-middle me-1"></i> Cetak PDF
                            </button>
                            <button type="button" class="btn btn-success" (click)="cetakWord()" [disabled]="laporanForm.invalid || isGenerating">
                                <i class="ri-file-word-line align-middle me-1"></i> Cetak Word
                                <span *ngIf="isGenerating" class="spinner-border spinner-border-sm ms-1" role="status" aria-hidden="true"></span>
                            </button>
                            <div *ngIf="laporanForm.invalid" class="text-danger align-self-center ms-2 small">
                                *Harap lengkapi semua field yang wajib diisi.
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
